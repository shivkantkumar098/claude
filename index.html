<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Record money received and expenses, and keep track of your available balance."
    />
    <title>Vidyarthi Khataa — Transactions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="wrapper">
      <header class="page-header">
        <h1>Vidyarthi Khataa</h1>
        <p>Keep track of money received and expenses.</p>
      </header>

      <section class="balance-card" aria-labelledby="balance-heading">
        <h2 id="balance-heading">Available balance</h2>
        <p
          class="balance-value"
          id="balance-amount"
          aria-live="polite"
          hidden
        >₹0.00</p>
      </section>

      <section class="transaction-form-card" aria-labelledby="form-heading">
        <h2 id="form-heading">Add a transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field">
            <label for="transaction-type">Type</label>
            <select
              id="transaction-type"
              name="type"
              aria-describedby="type-error"
              required
            >
              <option value="Expense">Expense</option>
              <option value="Money Received">Money Received</option>
            </select>
            <p class="field-error hide" id="type-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="transaction-amount">Amount (INR)</label>
            <input
              id="transaction-amount"
              name="amount"
              type="number"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              autocomplete="off"
              aria-describedby="amount-error"
              required
            />
            <p class="field-error hide" id="amount-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="transaction-date">Date</label>
            <input
              id="transaction-date"
              name="date"
              type="date"
              aria-describedby="date-error"
              required
            />
            <p class="field-error hide" id="date-error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="transaction-note">Note (optional)</label>
            <input
              id="transaction-note"
              name="note"
              type="text"
              maxlength="240"
              autocomplete="off"
            />
          </div>

          <p class="form-error hide" id="form-error" role="alert"></p>
          <p class="form-success hide" id="save-status" role="status"></p>
          <button class="submit" id="save-transaction" type="submit" disabled>
            Add transaction
          </button>
        </form>
      </section>

      <section class="history-card" aria-labelledby="history-heading">
        <h2 id="history-heading">Transaction history</h2>
        <div class="field history-filter">
          <label for="transaction-filter">Filter by type</label>
          <select id="transaction-filter" name="filter" autocomplete="off" disabled>
            <option value="all" selected>All</option>
            <option value="income">Income</option>
            <option value="expenses">Expenses</option>
          </select>
        </div>
        <p id="load-error" class="load-error hide" role="alert"></p>
        <button class="retry-load hide" id="retry-load" type="button">
          Retry loading transactions
        </button>
        <p id="empty-state" hidden>
          No transactions yet. Add one to get started.
        </p>
        <p id="filter-empty-state" role="status"></p>
        <div id="transaction-history" aria-live="polite"></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
